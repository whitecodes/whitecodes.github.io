name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4
        with:
          path: blog

      - name: Checkout theme
        uses: actions/checkout@v4
        with:
          repository: ChongxiSama/Lonetrail
          ref: main
          path: theme

      - name: Overlay blog content onto theme
        run: rsync -a blog/src/ theme/src/ && rsync -a blog/public/ theme/public/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: theme/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: theme

      - name: Build Astro site
        run: pnpm build
        working-directory: theme

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: theme/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
